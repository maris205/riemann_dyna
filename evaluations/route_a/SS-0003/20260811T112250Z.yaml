    - formal/results/ss_0003_connected_renewal.md

a2:
  verdict: A2_ANALYTIC_DETERMINANT
  evidence_status: PROVED
  strongest_evidence: >-
    For Re(s)>1 the frozen graph adjacency family is holomorphic, rank at
    most two, and trace class with
    ||L_s||_1=2*(sum_{n>=2}n^(-Re(s)))^(1/2).  Its exact trace powers give the
    same-object identity det_Fr(I-L_s)=1-sum_{n>=2}n^(-s)=2-zeta(s).
  strongest_failure: >-
    The same determinant has a unique real zero sigma_star in (1,2), already
    inside its Fredholm domain, whereas completed xi is zero-free for Re(s)>1.
    The scalar continuation cannot repair this extra zero, and the cycle
    trace-log converges on a smaller domain than the Fredholm determinant.
  metrics:
    defining_fredholm_domain: "Re(s)>1"
    operator_rank_bound: 2
    trace_norm_identity: "2*(sum_(n>=2)n^(-Re(s)))^(1/2)"
    determinant_identity_exact: true
    cycle_log_domain: "|sum_(n>=2)n^(-s)|<1"
    zero_error_train: "not_applicable_no_target_data"
    zero_error_validation: "structural_extra_zero"
    zero_error_test: "not_evaluated_after_exact_rejection"
    extra_zero_count: "at least one; exactly one positive real zero in 1<Re(s)<2"
    missing_zero_count: "not_enumerated; divisor equality is already impossible"
    root_count_discrepancy: "one forbidden zero in the target zero-free half-plane"
    cutoff_drift: "not_applicable_exact_infinite-rank-definition_and_finite-rank-collapse"
    precision_drift: "not_applicable_exact_proof"
    control_margin: "S(2)<3/4<1 while S(sigma)->infinity as sigma->1+"
    numerical_root_search_used: false
  artifacts:
    - artifacts/ss_0003/connected_renewal_audit.json
    - formal/obstructions/positive_renewal_right_half_plane_zero.md

a3:
  verdict: A3_FAIL
  evidence_status: PROVED
  strongest_evidence: >-
    The separately named scalar continuation 2-zeta(s) has conjugation
    symmetry and, by Landau's fixed-a theorem, Theta(T log T) nontrivial zeros
    in the fixed strip 0<Re(s)<2.  This is a genuine divisor-order prefilter,
    not a numerical fit.
  strongest_failure: >-
    Divisor-order agreement alone is insufficient.  The scalar continuation
    is meromorphic at s=1, is not a same-operator Fredholm continuation, has a
    forbidden extra real zero, and supplies neither the xi functional
    equation nor the Gamma/trivial-zero/pole-removal ledger.
  metrics:
    scalar_continuation: "2-zeta(s) on C\\{1}"
    same_operator_global_continuation: false
    conjugation_symmetry: true
    fixed_strip_divisor_growth: "Theta(T log T)"
    functional_equation: false
    gamma_and_trivial_zero_ledger: false
