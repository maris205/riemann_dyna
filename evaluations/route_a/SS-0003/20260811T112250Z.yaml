source_lock:
  object: >-
    Connected directed hub-and-spoke graph with vertices {h} union
    {v_n:n>=2}, edges h->v_n and v_n->h, zero potential, and roof
    (1/2)log(n) on each edge of the n-excursion.  On C direct_sum
    ell^2({2,3,...}), L_s(c,x)=(sum_n n^(-s/2)x_n,
    c(n^(-s/2))_n) for Re(s)>1, using the holomorphic bilinear coordinate
    functional.
  data_type: >-
    Exact connected renewal graph and primitive/repetition ledger; same-object
    finite-rank Fredholm determinant only on Re(s)>1; separately named scalar
    continuation and classical target-free a-point count.
  clock: >-
    One directed edge is the edge clock; an n-excursion has roof log(n), and
    a renewal word has roof sum_i log(n_i)=log(product_i n_i).
  normalization: >-
    Counting-measure Hilbert space, zero potential, transfer weight
    exp(-s*tau_edge), global phase one, and no affine spectral map.
  determinant_convention: >-
    D_ren(s)=det_Fr(I-L_s)=1-sum_{n>=2}n^(-s)=2-zeta(s) on Re(s)>1.
    The trace-log/Euler ledger is opened only where
    |sum_{n>=2}n^(-s)|<1.  The scalar continuation 2-zeta(s) is not called a
    Fredholm continuation of the original ell^2 family.
  cutoff: >-
    No mathematical cutoff.  The exact audit uses labels 2..10, cyclic words
    through renewal length four, and edge traces through power eight.
  precision: >-
    Exact integer combinatorics, finite-rank algebra, elementary inequalities,
    and a cited classical a-point theorem; no floating-point root or spectrum
    computation.
  allowed_data:
    - "all integer labels n>=2 and graph incidence"
    - "elementary Dirichlet-series and Fredholm finite-rank algebra"
    - "published fixed-a counting theorem for zeta(s)=2"
  forbidden_data:
    - "prime tables, primality predicates, von-Mangoldt tables, or prime-derived labels"
    - "Riemann-zero tables, USTC/GUE data, or numerical root searches"
    - "fitted roofs, weights, phases, offsets, scales, or unfolding"
    - "reciprocal/log-derivative substitution, scattering gluing, or hidden zero factors"
  training_split: "empty; the object is parameter-free and no target data are used"
  validation_split: >-
    Exact connectivity, renewal-necklace/repetition ledger, non-lattice proof,
    finite-rank determinant identity, and right-half-plane obstruction.
  test_split: >-
    Disjoint labels 7..10, source/hash reproduction, and the fixed-strip
    a-point theorem; no target zeros are used.
  stopping_conditions:
    - "REVISE if the graph trace or finite-rank determinant identity fails"
    - "REJECTED if prime/zero data, fitting, root search, or ledger gluing enters"
    - "STOP_SCOPED once a forbidden right-half-plane zero is proved"

a1:
  verdict: A1_WEAK
  evidence_status: PROVED
  strongest_evidence: >-
    Primitive renewal orbits are the intrinsic cyclically primitive words on
    all labels n>=2.  Repetitions, cyclic rotations, edge periods, actions,
    and the two edge-start sectors are accounted for exactly, with no orbit
    search or arithmetic table.
  strongest_failure: >-
    The alphabet consists of every integer, not rational primes.  Its cycles
    are ordered-factorization necklaces with unit potential; no natural
    prime-orbit correspondence, von-Mangoldt amplitude, or dynamical stability
    law is present.  The discrete edge graph also has period two.
  metrics:
    graph_strongly_connected: true
    discrete_edge_period: 2
    induced_renewal_grammar: "full countable shift on labels n>=2"
    primitive_definition: "cyclically primitive integer words"
    repetition_ledger_exact: true
    non_lattice_roof: true
    direct_prime_lookup: false
    direct_zero_lookup: false
    missed_orbit_risk: "none for the frozen renewal grammar"
