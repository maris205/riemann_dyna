    The n=1 component of the frozen asymmetric magnetic lollipop-theta graph,
    audited through its 6x6 sinc-matching matrix and its parent 8x8 directed
    bond determinant. The infinite 1/n tower is outside this local determinant.
  data_type: >-
    Exact entire physical matching characteristic C_phys(k), exact pole-free
    F(k)=k^2*C_phys(k), and high-precision comparison with Delta_bond(k).
  clock: raw positive wavenumber k=sqrt(lambda) of the n=1 component
  normalization: >-
    A=C_phys(0)>0 and chi_0(k)=C_phys(k)/A with chi_0(0)=1. The separate raw
    bond factor beta(k)=-(3/(4*A*k^2))*Delta_bond(k) retains exp(i*k*L0).
  determinant_convention: >-
    BASE_PHYSICAL_MATCHING_ONLY. No tower Euler, Fredholm, relative,
    Weierstrass, heat-zeta, or completed-xi determinant is opened.
  cutoff: >-
    Exact all-k 6x6 matching formula; Taylor through C_phys k^2 and Delta_bond
    k^3; fixed samples 0.11, 0.731, 1.2, and pi.
  precision: >-
    SymPy exact radicals/root-of-unity phases and 80-digit mpmath residuals.
  allowed_data:
    - configs/source_locks/QG-0001-BASE-CHARACTERISTIC.yaml
    - exact vertex matching and finite bond scattering algebra
    - standard Dirichlet zero-mode argument
  forbidden_data:
    - prime tables, zero tables, fitting, and spectral anchoring
    - tower determinant regularization or borrowed spectral-zeta zeros
    - treating individual sin(k*ell_e)=0 factors as automatic eigenvalues
    - Route B or Hilbert-Polya claims
  training_split: exact matrix definition, k=0 determinant, and parity identity
  validation_split: exact F=k^2*C_phys identity and Taylor coefficients
  test_split: high-precision bond identity at all frozen sample wavenumbers,
    including an edge-Dirichlet point k=pi
  stopping_conditions:
    - stop if the matching matrix, clock, phase convention, or normalization changes
    - revise if the exact k=0 value, parity, or bond identity fails
    - do not open the tower relative product until this local audit is recorded

