  strongest_evidence: >-
    The graph intrinsically defines oriented primitive directed-bond orbits.
    Exhaustive exact enumeration gives 10, 45, and 330 primitive orbits at
    topological periods 2, 4, and 6, and every trace/repetition ledger through
    period six agrees exactly. The 1/n rule then transports every orbit,
    signed scattering amplitude, and magnetic phase to all tower components.
  strongest_failure: >-
    The metric periods L_p/n accumulate at zero and have no intrinsic log-prime
    ordering or von-Mangoldt repetition law. Vertex scattering weights are not
    arithmetic weights, and no higher-period arithmetic anomaly is established.
  metrics:
    primitive_orbits_period_2: 10
    primitive_orbits_period_4: 45
    primitive_orbits_period_6: 330
    based_closed_words_period_6: 2000
    exact_trace_repetition_checks: 6
    direct_prime_lookup: false
    direct_zero_lookup: false
    periods_accumulate_at_zero: true
    arithmetic_orbit_law: false
