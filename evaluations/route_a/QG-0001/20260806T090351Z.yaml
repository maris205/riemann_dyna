source_lock:
  object: >-
    The disjoint union over n>=1 of exact 1/n metric scalings of one frozen
    magnetic lollipop-theta graph. The base has three L--R edges of lengths
    1,sqrt(2),sqrt(3), one L--D pendant of length sqrt(5), Kirchhoff vertices
    of degrees four and three, a Dirichlet terminal, and fixed L-outward
    magnetic line integrals 0,pi/3,2*pi/3,0.
  data_type: >-
    Exact directed-bond orbit/scattering ledger, theorem-level magnetic
    Laplacian scaling and wavenumber count, and no global determinant.
  clock: >-
    Raw metric length L_(p,n)=L_p/n and raw positive wavenumber K=sqrt(lambda).
    The tower label is a component index, not a fitted time reparameterization.
  normalization: >-
    Squarefree base lengths, exact 1/n scaling, fixed sixth-root oriented edge
    phases, covariant Kirchhoff scattering, Dirichlet reflection -1, and no
    scale, offset, unfolding, zero anchoring, or affine spectral fit.
  determinant_convention: >-
    NOT_OPENED. Ordinary orbit product, component bond product, heat/spectral
    zeta, and any regularized characteristic determinant remain separate data
    types and may not be substituted for one another.
  cutoff: >-
    Complete base primitive directed-bond census through topological period
    six; all tower components and the K*log(K) count handled by exact scaling.
  precision: >-
    Exact Fraction scattering and trace arithmetic, integer phase/length
    ledgers, theorem-level operator algebra, and binary64 only for displays.
  allowed_data:
    - frozen graph grammar, vertex conditions, metric scaling, and magnetic line integrals
    - exact finite graph scattering and cyclic-word enumeration
    - standard compact metric-graph Weyl and direct-sum operator theorems
    - Riemann-von Mangoldt asymptotic as a structural target constraint
  forbidden_data:
    - prime tables, primality predicates, Riemann-zero tables, or target fitting
    - validation/test optimization or post-hoc graph/clock/scale changes
    - silent determinant regularization or cross-ledger zeta promotion
    - discarded orientation, signed scattering amplitude, or magnetic phase
    - Route B, Hilbert-Polya, or RH claims in this prefilter
  training_split: "base periods 1-2 and component labels 1-4; identity checks only"
  validation_split: "base periods 3-4 and component labels 5-8"
  test_split: >-
    base periods 5-6, component labels 9-16, all-order count theorem, and the
    pendant-bounce ordinary-product obstruction
  stopping_conditions:
    - stop if target data leaks into the candidate definition
    - revise if exact trace/repetition or local antiunitary checks fail
    - stop the naive determinant at short-orbit accumulation
    - do not open Route B without one same-object determinant and trace ledger

