source_lock:
  object: >-
    Countable disjoint cyclic suspension Sigma=disjoint_union_{n>=2} Z/nZ
    with sigma(n,j)=n,j+1, roof tau_n=1+sqrt(2)/n, per-step potential
    phi_n=-n, and transfer block exp(-n-s*tau_n) times the cyclic shift.
  clock: "one suspension step; primitive cycle n has L_n=n+sqrt(2)"
  normalization: "ell^2 counting measure, positive weight exp(phi_n-s*tau_n), global phase 1"
  determinant_convention: "D_bouquet(s)=det_Fr(I-L_s), with the product ledger frozen"
  cutoff: "all n>=2 theorem; exact ledger and disjoint test blocks n=2..12"
  precision: "exact integer/rational identities plus a certified rational sqrt(2) bracket"
  allowed_data:
    - "integer labels and cyclic shifts"
    - "elementary trace-class/Fredholm algebra"
    - "rational enclosures for sqrt(2) and pi for display-only diagnostics"
  forbidden_data:
    - "prime or Riemann-zero tables, primality predicates, USTC/GUE data"
    - "fitted weights, roof offsets, affine rescaling, or post-hoc unfolding"
    - "separate determinants, scattering quotients, or absolute-value ablations"
    - "numerical root searches and Route-B inference"
  training_split: "Empty; no fitting or target data"
  validation_split: "Exact blocks n=2..6, primitive/repetition identities, trace-class and incommensurability checks"
  test_split: "Disjoint exact blocks n=7..12 plus the fixed-strip divisor theorem"

a1:
  verdict: A1_WEAK
  evidence_status: PROVED
  strongest_evidence: >-
    The symbolic dynamics has exactly one intrinsic primitive n-cycle for every
    n>=2, with exact repetition accounting and no missed-orbit search.
  strongest_failure: >-
    The phase space is a disconnected bouquet and the lengths n+sqrt(2) and
    actions n^2 are modeling choices with no log-prime law or von-Mangoldt
    repetition weight.
  metrics:
    primitive_orbits_per_label: 1
    primitive_label_range_audit: "2..12"
    repetition_formula_verified: true
    arithmetic_orbit_law: false
    connected_or_mixing_base: false
    missed_orbit_risk: none_for_frozen_bouquet
  artifacts:
    - experiments/ss_prefilter_irrational_bouquet.py
    - artifacts/ss_prefilter_irrational_bouquet/audit.json

a2:
  verdict: A2_ANALYTIC_DETERMINANT
  evidence_status: PROVED
  strongest_evidence: >-
    The block-diagonal family is entire and trace class in s, and the same
    Fredholm ledger factorizes exactly as product_{n>=2}(1-exp(-n^2-s*(n+sqrt(2))));
    the trace-power/repetition identity is explicit.
  strongest_failure: >-
    The closed-form divisor has only O(T) zeros in every bounded vertical strip,
    so this analytic determinant fails the completed-xi T log T regime.
  metrics:
    determinant_defined: true
    locally_uniform_trace_class: true
    factorization_exact: true
    zero_error_train: not_testable_no_target_data
    zero_error_validation: not_testable_no_target_data
    zero_error_test: not_testable_no_target_data
    fixed_strip_divisor_growth: O(T)
    target_divisor_growth: Theta(T_log_T)
    cutoff_drift: not_applicable_closed_form
    precision_drift: not_applicable_exact_formulas
  artifacts:
    - artifacts/ss_prefilter_irrational_bouquet/audit.json
    - formal/obstructions/countable_irrational_bouquet_linear_divisor.md

