source_lock:
  object: >-
    Exact-U_c Logistic map f(x)=1-U_c*x^2 on J=[-(U_c-1),1], with the
    proof-coordinate reflected two-iterate map G=q^(-1)o(-f^2)o q on
    I=[-pi/2,pi/2], q(theta)=(U_c-1)sin(theta). The named density w is the
    normalized invariant density of G; g_A is the conditional f^2-acip on
    A=[-(U_c-1),U_c-1], and h is the full physical f-acip density on J.
  data_type: >-
    Exact inverse-branch identities, the expanding-Markov RPF theorem already
    locked for the parent audit, a forward-invariant log-Lipschitz cone, exact
    rational endpoint intervals, and outward-rounded deterministic arithmetic.
    No finite-rank residual is used as an infinite-dimensional error bound.
  clock: >-
    One iterate of f is one physical tick. f^2 and theta are proof coordinates;
    return labels remain 2n.
  normalization: >-
    Integral_I w=1, integral_A g_A=1, integral_J h=1, g_A(0)=2h(0), and
    C_h=h(0)/(sqrt(2)*U_c). These ledgers are kept separate.
  determinant_convention: >-
    No determinant is defined. The s-independent density transfer operator is
    not a Riemann zeta, Fredholm determinant, reciprocal zeta, or xi divisor.
  cutoff: >-
    Cone slope 3/4; explicit endpoint remainder for 0<t<=1/200; finite
    physical branches C_12,C_14,C_16,C_18; 100-digit U_c and pi brackets.
  precision: >-
    Exact Fraction algebra for structural gates and 180-digit Decimal working
    arithmetic with 40-place outward presentation. The pi bracket is checked
    independently by 100/30-term Machin alternating series.
  training_data: "empty; no fitting and no target data"
  validation_data: >-
    Root sign bracket, inverse contraction, distortion bounds, cone
    invariance, local remainder gates, and normalization conversions.
  test_data: >-
    Sealed exact endpoint intervals for returns 12,14,16,18 and byte-identical
    CLI reproduction.
  allowed_data:
    - exact U_c polynomial and prior exact support/endpoint theorems
    - classical expanding-Markov RPF theory
    - deterministic target-free rational and decimal arithmetic
  forbidden_data:
    - prime or zero tables, primality predicates, xi/zeta evaluations, USTC data
    - fitted densities, fitted coefficients, orbit histograms, or target matching
    - finite-rank residuals presented as resolvent/tail certification
    - determinant, quantization, Route-B, Hilbert-Polya, or RH claims
  stopping_conditions:
    - "REVISE if cone invariance or normalization cannot be verified"
    - "REJECTED if arithmetic target data enters"
    - "STOP_SCOPED for determinant, quantization, Route-B, or RH inference"
  error_budget_categories:
    discretization: "not used; full theta interval is covered analytically"
    truncation: "not used"
    rounding: "180-digit working arithmetic with outward 40-place presentation"
    normalization: "w -> g_A -> h ledger is explicit"
    iteration_stopping: "not used; no stationary-vector iteration"
    resolvent_tail: "not used; direct cone bound replaces it"

