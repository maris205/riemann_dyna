source_lock:
  object: >-
    The target-free non-palindromic three-kick Hénon ratchet
    G=F_(5/2) o F_(3/2) o F_(1/2), where
    F_a(q,p)=(1-a*q^2-p,q), on (R^2,dq wedge dp). The fixed half-integer
    ramp is a declared modeling choice and the three kicks are one autonomous
    superstep, not three separate clocks.
  data_type: >-
    Exact rational polynomial identities, exact Groebner elimination over QQ,
    square-free and Sturm real-root counts, and outward rational interval
    propagation for signed orbit monodromy. Binary64 coordinates are display
    diagnostics only.
  clock: >-
    One application of G, equal to the ordered three-kick superstep. Individual
    micro-kicks are not primitive periods and may not be mixed into the orbit
    ledger.
  normalization: >-
    Raw (q,p) coordinates with signed monodromy trace, multipliers, and
    det(I-M)=2-tr(M); no scale, offset, unfolding, modulus-only reduction,
    phase anchoring, or target matching.
  determinant_convention: >-
    NOT_OPENED. No Z, reciprocal Zeta, logarithmic derivative, cycle product,
    transfer determinant, or Fredholm determinant is defined in this prefilter.
  cutoff: >-
    Complete real primitive G-period 1 and 2 phase-point census on the full
    plane. The micro-kick horizon is six. G-period 3 and above are excluded.
  precision: >-
    SymPy exact QQ algebra; exact Sturm isolation refined below rational width
    1e-28; outward rational interval monodromy bounds; binary64 only for
    displayed coordinates.
  allowed_data:
    - target-free legacy parent F_a(q,p)=(1-a*q^2-p,q)
    - exact rational algebra and elementary symplectic geometry
    - fixed half-integer ramp a_j=j+1/2 for j=0,1,2
    - same-object primitive orbits and signed monodromy data
    - parent F_1 and low-depth reversibility controls
  forbidden_data:
    - prime tables, primality predicates, or prime-derived lengths
    - Riemann-zero, zeta, xi, GUE, or USTC data
    - legacy Hénon scripts/notebooks 4 through 9 as candidate inputs
    - legacy fitted a, hbar, quartic, smoothing, schedule, or spectral anchors
    - changing the kick order or parameter rule after inspecting the UPO ledger
    - replacing signed multipliers or det(I-M) by absolute values
    - calling negative multipliers a Maslov or magnetic phase
  training_data: "empty; no arithmetic target data or fitted parameters"
  validation_data: >-
    Exact generating-function and determinant checks, explicit inverse, degree
    eight, inherited swap failure, reverse-schedule test, and affine
    anti-symplectic leading-term obstruction.
  test_data: >-
    Sealed period-1/2 Groebner shapes and polynomial hashes, square-free and
    Sturm counts, primitive quotient, orbit pairing, signed monodromy,
    hyperbolicity margins, and byte-reproducible artifact.
  stopping_conditions:
    - exact symplecticity, invertibility, or the data firewall fails
    - G is shown conjugate to a legacy single-kick F_a by an audited low-complexity transformation
    - polynomial hashes or real-root counts fail to reproduce
    - a certified short orbit is non-hyperbolic or period-two pairing fails
    - any nonlinear anti-symplectic reversor is found, stopping an absolute time-reversal-breaking claim
    - any determinant, target-zero, Route-B, Hilbert-Polya, or RH inference is attempted in this prefilter

