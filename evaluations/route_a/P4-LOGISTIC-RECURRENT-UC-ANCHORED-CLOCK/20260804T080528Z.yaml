    B={(omega,j):omega in N_{>=1}^Z, 1<=j<=2*omega_0} and anchored fibre
    F(x,omega,j)=(1-mu(j,2*omega_0)*x^2,G(omega,j)).
  data_type: >-
    Exact algebraic anchor and finite combinatorics; deterministic binary64
    left/center/right gap diagnostics; one signed full-fibre witness per
    primitive tower orbit through period 16; reciprocal Artin-Mazur ledger.
  clock: >-
    One tower-age step equals one Logistic update. Symbol m has exactly L=2*m
    updates j=1,...,L; the terminal update uses U_c before renewal. A sigma
    renewal is not one clock unit.
  normalization: >-
    Raw x,y in [-1,1], partition at y=0, integer age, and raw even gap L=2*m.
    No gap shift, time rescaling, unfolding, phase fit, or tuned partition.
  determinant_convention: >-
    Z_T(z)=(1-z^2)/(1-2*z^2) is the tower Artin-Mazur zeta. The distinct full
    ledger is D_AM,F(z)=exp(-sum_(n>=1) Fix(F^n)*z^n/n), locally defined for
    |z|<1/4. Neither object is called a Fredholm determinant.
  cutoff: >-
    Tower theorem all m,n>=1; exact enumerated prefix through physical period
    16; one full-fibre witness per primitive base orbit in that prefix; gap
    scans use four frozen initial states, burn-in 20000, and 300000 updates.
  precision: >-
    Exact algebraic identities and finite combinatorics where stated; CPython
    IEEE-754 binary64 diagnostics; terminal anchor bitwise U_c; fibre return
    residual ceiling 1e-12. Long-tail support is not certified.
