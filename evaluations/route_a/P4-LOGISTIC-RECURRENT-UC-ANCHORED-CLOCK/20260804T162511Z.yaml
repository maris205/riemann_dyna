    Exact-U_c Logistic map f(x)=1-U_c*x^2, where U_c is the unique real
    root of u^3-2*u^2+2*u-2=0, on its physical core J=[-(U_c-1),1].
    The endpoint audit uses T=f^2 on A=[-rho,rho], its reflection S=-T,
    and the polar coordinate x=rho*sin(theta) only as proof coordinates.
    The named measure is the unique physical f-acip mu_ac with total mass
    one, and h=d mu_ac/dx is its canonical density representative.
  data_type: >-
    Exact algebra, Jiang-Ruelle analytically expanding Markov RPF theory,
    exact physical Perron-Frobenius inverse-branch asymptotics, the already
    proved first-return branch geometry and endpoint-length ratio, and
    deterministic 180-decimal structural diagnostics. Published spike
    decompositions are independent cross-checks, not fitted inputs.
  clock: >-
    One iterate of f is one physical tick. T=f^2 and the polar coordinate
    are proof coordinates only. A physical branch C_(2n) retains return
    time 2n; no acceleration or roof change is made.
  normalization: >-
    Raw x-coordinate, strict event x<0 with zero a non-event, mu_ac(J)=1,
    and h=d mu_ac/dx. The conditional T-acip mu_A on A has total mass one,
    while mu_ac(A)=1/2 and d mu_A/dx=2h on A. These ledgers are not mixed.
  determinant_convention: >-
    No candidate determinant is defined in this audit. The s-independent
    RPF operator used to prove existence of the invariant density is not a
    Riemann dynamical Zeta, Fredholm determinant, reciprocal zeta, or
    completed-xi determinant.
  cutoff: >-
    The theorem covers all sufficiently small t>0 and n->infinity. Sealed
    algebraic diagnostics use t=10^-8,10^-16,10^-32,10^-64 and a 1024-cell
    polar derivative grid. The inherited exact endpoint certificate remains
    through branch 154 / return 308 but is not used to fit the theorem.
  precision: >-
    Exact real analysis for the theorem; 180-decimal deterministic arithmetic
    for algebraic and inverse-Jacobian diagnostics. Long binary64 orbit
    histograms are excluded from theorem evidence.
  allowed_data:
    - "the algebraic U_c equation and exact first-return results already in the repository"
    - "Jiang-Ruelle 2005 RPF theory and corrected published Misiurewicz spike results"
    - "target-free exact or high-precision structural diagnostics"
    - "legacy sources solely for explicit claim correction"
  forbidden_data:
    - "prime tables, primality predicates, prime-gap histograms, Riemann-zero tables, xi/zeta evaluations, or USTC data"
    - "fitting the exponent, endpoint coefficient, branch weights, roof, phase, or partition to arithmetic targets"
    - "using a floating-point orbit histogram as proof of an acip asymptotic"
    - "mixing the A-conditional density with the full f-acip density"
    - "restoring the refuted ordinary-BV uniform-expansion claim for the unaccelerated first-return map"
    - "calling the proof-coordinate RPF operator a Riemann Fredholm determinant"
  training_split: "empty; no fitting and no target data"
  validation_split: >-
    Algebraic band identities, the two-full-branch polar conjugacy, analytic
    inverse branches, primitive Markov graph, and inf|G'|=4/U_c^2>1.
  test_split: >-
    Sealed inverse-Jacobian scales, the one-preimage ledger at -rho, the
    corrected published spike coefficient, equivalent mass-ratio forms, and
    byte reproduction of the structural artifact.
  stopping_conditions:
    - "REVISE if the physical acip, its normalization, or the finite positive trace h(0) is not proved"
    - "REVISE if the polar conjugate fails the full-branch analytic-expansion hypotheses"
    - "STOP_SCOPED for the raw first-return map as an ordinary uniformly expanding BV map"
    - "STOP_SCOPED for any attempt to infer a Riemann determinant from this density-only result"
    - "REJECTED if target arithmetic or zero data enters"

