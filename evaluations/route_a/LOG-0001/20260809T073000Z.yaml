    A cancellation-safe same-determinant theorem for D_pol'(2), a certified
    scalar lower bound c_2>0.0213, and the Cauchy maximum-modulus lower bounds.
  clock: >-
    T_gamma=sum tau=log|(G^n)'| is the sole determinant clock; the physical
    two-Logistic-iterate clock remains separate.
  normalization: >-
    q(theta)=(U_c-1)sin(theta), exp(s*Log(a))=exp(-s*tau), signed
    epsilon_omega retained, matching condition unchanged, and M_D(R) is
    measured in the original s-plane.
  determinant_convention: >-
    Delta(lambda,s)=det_Fr(I-lambda*L_s|_B), D_pol(s)=Delta(1,s), with lambda
    kept distinct from s; no reciprocal, zeta-regularized, logarithmic-
    derivative, or glued determinant is used.
  cutoff: >-
    No theorem word or operator cutoff. The n=1 pure-left word L is retained
    only as a strict lower-bound term after positivity of the complete real
    differentiated trace ledger is proved; it is not a determinant truncation.
  precision: >-
    Exact analytic inequalities plus 1024-bit outward Arb scalar arithmetic;
    inherited U_c bracket and same-object trace theorem are frozen.
  allowed_data:
    - exact U_c polynomial and inherited certified root bracket
    - inherited nuclear Fredholm determinant and exact signed all-power trace
    - inherited zero-free half-plane and trace-log majorant
    - inherited pure-left boundary trace alpha_0=U_c^2/4
    - standard locally uniform differentiation and Cauchy estimates
    - target-free outward Arb arithmetic
  forbidden_data:
    - prime, primality, Riemann-zero, xi, zeta, or USTC tables/evaluations
    - Fredholm determinant values or root searches
    - auxiliary-lambda coefficients substituted for D_pol(s)
    - D_pol'(0), uncontrolled single terms, absolute-value determinant ledgers
    - changed clock, normalization, domain, matching, branch signs, or convention
  training_split: empty; no fitting, parameter search, target data, values, or roots
  validation_split: >-
    Local uniform differentiation, positivity of every real-axis summand,
    exact pure-left term, trace-log lower factor, and Cauchy geometry.
  test_split: >-
    Sealed 1024-bit Arb scalar intervals, exact bracket signs, safe floors,
    source hashes, frozen versions, and byte-identical artifact reproduction.
  stopping_conditions:
    - NOT_TESTABLE if local uniform differentiated trace-log convergence fails
    - NOT_TESTABLE if complete real-ledger summands are not all positive
    - REVISE if pure-left matching multiplicity or alpha_0 differs
    - REVISE if an auxiliary-lambda coefficient or determinant truncation is used
    - REJECTED if target data, roots, or a changed ledger enters
    - STOP_SCOPED for positive/exact order, exponential lower growth, divisor lower bounds, Route B, Hilbert-Polya, or RH

