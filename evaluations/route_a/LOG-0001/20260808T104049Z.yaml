    The unchanged exact-U_c two-full-branch polar map, intrinsic roof
    tau=log|G'|, frozen radius-1/1000 stadium transfer family L_s on
    B=ker[v_L(0)-v_R(0)], and its canonical same-object determinant
    D_pol(s)=det_Fr(I-L_s|_B). Normalized Riemann maps and their inner-domain
    ratios are proof coordinates only.
  data_type: >-
    An exact determinant-coefficient growth theorem, Jensen zero-count upper
    bound, exact trace-log zero-free half-plane, and a sealed target-free
    100-digit constant/combinatorial regression.
  clock: >-
    T_gamma=sum tau=log|(G^n)'| is the sole determinant time, with
    tau_*=log(4/U_c^2). The two-Logistic-iterate physical clock remains
    separate.
  normalization: >-
    q(theta)=(U_c-1)sin(theta), exp(s*Log(a))=exp(-s*tau) on inverse cycles,
    phi_L'=+a, phi_R'=-a, signed epsilon_omega retained, and no scale,
    offset, unfolding, or matching factor.
  determinant_convention: >-
    Delta(lambda,s)=det_Fr(I-lambda*L_s|_B) is the canonical Grothendieck
    determinant and D_pol(s)=Delta(1,s). Lambda remains distinct from s.
  cutoff: >-
    No word or operator cutoff in the theorem. The target-free regression
    checks the two-stream allocation exponent through q=24 and the safe line
    Re(s)=2.
  precision: >-
    Exact analytic theorem plus mpmath 1.3.0 at 100 decimal digits. The
    inherited complex Log(a) variation is bounded by 0.000851 and gives the
    safe norm envelope ||ell||<0.824.
  training_data: "empty; no fitting, parameter search, target data, determinant values, or roots"
  validation_data: >-
    Two B-valued geometric rank-one streams, principal-minor majorization,
    p-nuclear determinant continuity for p<2/3, quadratic exponential growth,
    Jensen counting, and a lambda-disk trace-log argument reaching lambda=1.
  test_data: >-
    Exact U_c bracket, alpha_0, tau_*, sigma_*, safe-line trace-log bound,
    complex-log envelope, all q<=24 allocation exponents, source hashes, and
    byte-identical artifact reproduction.
  allowed_data:
    - exact U_c polynomial and inherited certified root bracket
    - inherited exact roof lower bound, complex branches, nuclear determinant, and signed trace theorem
    - standard Riemann mapping, Sylvester, Hadamard, q-binomial, Grothendieck determinant continuity, and Jensen theorems
    - target-free numerical and combinatorial regression
  forbidden_data:
    - prime tables, zero tables, xi/zeta evaluations, USTC data, or fitting
    - Fredholm determinant values or root searches
    - changed domains, roof, clock, signs, matching, or determinant convention
    - exact-order, lower-bound, T-log-T, completed-xi, Route B, Hilbert-Polya, or RH claims
  stopping_conditions:
