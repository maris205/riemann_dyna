a2:
  verdict: A2_FAIL
  evidence_status: PROVED
  strongest_evidence: >-
    C_sigma is Hilbert-Schmidt, so its complementary factor has the exact
    genus-one determinant D_(sigma,tail,2)=det_2(I-z*C_sigma), and the
    logarithm normalized at zero gives the exact same-ledger ratio identity
    g_sigma=log(G_H)-log(D_(sigma,tail,2)). RH-282 proves the slope-four tail
    bound without constructing a physical Riesz compression.
  strongest_failure: >-
    No physical-clock q-selected spectrum or tau stream with a frozen
    discretization/cutoff/precision ledger is archived, no target divisor is
    tested, and D_(sigma,tail,2) is only a complementary factor. Earlier
    fixed-noise finite spectra do not pay the moving-order obligation.
    Convergence to G_H would not identify completed xi. Treating g_sigma
    itself as a determinant or mixing it with the head/counterloop determinant
    is invalid.
  metrics:
    exact_det2_factor: true
    exact_log_ratio_sign: "g=log(G_H)-log(D_tail_2)"
    same_ledger: true
    physical_invariant_compression_proved: false
    zero_error_train: not_applicable_no_target_roots
    zero_error_validation: not_testable_no_actual_spectrum
    zero_error_test: not_testable_target_zeros_forbidden
    extra_zero_count: not_testable
    missing_zero_count: not_testable
    root_count_discrepancy: not_testable
    cutoff_drift: not_testable_no_actual_tau_data
    precision_drift: not_testable_no_actual_tau_data
    control_margin:
      radius_left_margin: "rho-R=0.01"
      radius_right_margin: "rho_star-rho=0.016787483864074..."
      noisy_tail_power_at_rho_1_41: "0.3982299046794737"
      deterministic_tail_power_at_rho_1_41: "0.04734279160561648"
  artifacts:
