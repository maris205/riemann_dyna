source_lock:
  object: >-
    The same-ledger logarithmic residual
    g_sigma(z)=sum_(n>=2)(Tr(C_sigma^n)-a_n)z^n/n, where C_sigma is the
    q=1/2 normal realization of the complementary spectrum of
    A_sigma=K_sigma/r_H after peripheral deflation, and a_n is the fixed
    deterministic Hardy-anchor ledger.
  data_type: >-
    Complex all-order spectral power sums for one complementary det_2 factor
    compared with one deterministic same-family anchor. g_sigma is a
    logarithmic residual, not a standalone determinant, and C_sigma is not a
    proved physical invariant compression.
  clock: >-
    sigma tends to zero; n>=2 is determinant order; z is the Hardy variable.
    The all-order object has no cutoff. RH-302 alone uses
    m_sigma=ceil(4*log(1/sigma)); the later physical first-alias clock
    k=log(1/sigma)/(2*log(lambda))+O(1), u=4k, is separate and unused here.
    Any future numerical pre-audit is frozen to eta_k=0 and
    sigma_k=lambda^(-2k), without identifying k, n, and m_sigma.
  normalization: >-
    r_H=17/20, q=1/2, R=7/5, rho=141/100, and
    rho_star=r_H*lambda=1.426787483864074... . H2 uses normalized boundary
    L2, equivalently coefficient norm sum |c_n|^2*rho^(2n). All logarithms
    vanish at zero and complex cancellation is preserved.
  determinant_convention: >-
    D_(sigma,tail,2)=det_2(I-z*C_sigma)
    =exp[-sum tau_(sigma,n)z^n/n],
    g_sigma=log(G_H)-log(D_(sigma,tail,2)), and
    exp(-g_sigma)=D_(sigma,tail,2)/G_H. No Z, reciprocal, logarithmic
    derivative, full-trace, head, or counterloop ledger is substituted.
  cutoff: >-
    All n>=2 and every complementary algebraic eigenvalue with |mu_j|<=1/2.
    The certified proof split is 2<=n<m_sigma versus n>=m_sigma. No finite
    coefficient, spectrum, sigma, or boundary-grid cutoff is evidence for the
    annular limit.
  precision: >-
    Exact theorem-level identities and exact rho=141/100. Earlier fixed-noise
    finite spectra do not supply a physical-clock q-selected stream; no
    numerical annular norm with the required cutoff/precision ledger is
    present at the locked source commit.
  allowed_data:
    - exact legacy K_sigma, C_sigma, G_H, and a_n definitions
    - RH-263, RH-282, RH-300 through RH-311, RH-334, RH-341 through RH-361, and RH-VOL4
    - RH-7 fixed-noise spectra as provenance diagnostics only
    - target-free trace-ideal and complex-analytic arguments
  forbidden_data:
    - prime tables, Riemann-zero tables, xi/zeta samples, USTC data, or target fitting
    - changes to q, R, rho, r_H, determinant sign, or either clock
    - q_FT substituted for tau-a without d=h-s
    - cross-ledger gluing or separate absolute majorization of required signed cancellation
    - fixed-order or finite-grid evidence promoted to moving-order/all-order convergence
  training_split: "empty; no fitting, search, or target data"
  validation_split: >-
    Exact source definitions, det_2 ratio sign, radius inequalities, RH-300
    norm implications, RH-302 tail reduction, RH-309 endpoint membership and
    barrier, and RH-334 coefficient-type correction.
  test_split: >-
    Sealed theorem obligation: the actual H2(1.41) moving-head limit. It is
    not evaluated because neither actual spectra nor the theorem is available.
  stopping_conditions:
    - stop NOT_TESTABLE when actual tau data and an all-order theorem are both unavailable
    - revise if spectral selection, multiplicity, scaling, or determinant sign is ambiguous
    - reject if arithmetic target data enters or frozen choices are tuned
    - stop scoped if the residual is promoted to a standalone candidate or Route B

