stopping_conditions:
  - NOT_TESTABLE while neither actual mu_j/tau data nor an all-order actual annular theorem is available
  - REVISE if peripheral deflation, algebraic multiplicity, q selection, Hardy scaling, or the det_2 sign is ambiguous
  - REJECTED if target arithmetic data enters the definition or any frozen parameter is tuned after evaluation begins
  - STOP_SCOPED if g_sigma is promoted to a standalone HP candidate or C_sigma to a physical compression without a theorem
  - STOP_SCOPED for cross-ledger gluing, separate-absolute cancellation, completed-xi, Route-B, Hilbert-Polya, or RH inference

success_conditions:
  - >-
    For the frozen rho=1.41, prove
    ||sum_(2<=n<m_sigma)(tau_(sigma,n)-a_n)z^n/n||_(H2(rho))->0.
  - >-
    Equivalently by RH-302, prove ||g_sigma||_(H2(rho))->0; RH-300 then yields
    sum_(n>=2)|tau_(sigma,n)-a_n|R^n/n->0.
  - preserve the same complement, Hardy normalization, determinant sign, and clocks throughout

