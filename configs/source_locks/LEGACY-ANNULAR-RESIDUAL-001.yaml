    - A2_FAIL
    - A3_FAIL
    - A4_FAIL
  formal_candidate_created: false
  route_b_invocation_allowed: false
  checkpoint_status: DEFINED_NOT_TESTABLE
  standalone_candidate_verdict: STOP_SCOPED
  recommended_verdict: NOT_TESTABLE

next_smallest_test: >-
  Reopen first with a repository-backed actual q-selected complementary
  spectrum/tau stream on sigma_k=lambda^(-2k), including independently frozen
  discretization, spectral cutoff, precision, and stopping controls, or with a
  proof of the frozen H2(1.41) moving-head limit. Finite grids cannot replace
  the theorem. Do not switch to the first-alias counterloop ledger in this
  audit.
