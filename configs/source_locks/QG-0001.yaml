candidate_id: QG-0001
clue_id: CLUE-A4-003
title: Harmonic magnetic lollipop-theta tower
mathematical_object:
  base_graph:
    vertices:
      - "L: Kirchhoff vertex of degree 4"
      - "R: Kirchhoff vertex of degree 3"
      - "D: Dirichlet terminal vertex of degree 1"
    oriented_edges_from_L:
      - "e0: L->R, length 1, magnetic line integral 0"
      - "e1: L->R, length sqrt(2), magnetic line integral pi/3"
      - "e2: L->R, length sqrt(3), magnetic line integral 2*pi/3"
      - "e3: L->D, length sqrt(5), magnetic line integral 0"
  tower: >-
    The n-th connected component is an exact 1/n metric scaling of the base
    graph, with magnetic line integrals held fixed. The full graph is the
    disjoint union over n>=1.
  phase_space: "oriented metric-graph rays, with component label n in N"
  quantum_object: >-
    The orthogonal direct sum of scalar magnetic Laplacians on the scaled
    components, with covariant Kirchhoff conditions at L and R and Dirichlet
    condition at D.
data_type:
  primary: >-
    exact graph grammar, rational vertex-scattering amplitudes, squarefree
    metric-length vectors, sixth-root magnetic phases, and operator scaling
  orbit_data: >-
    oriented primitive directed-bond words, exact signed scattering weights,
    phase units modulo 6, and squarefree length-count vectors
  spectral_data: >-
    theorem-level component scaling and wavenumber counting asymptotic only;
    no computed eigenvalue or Riemann-zero table
clock: >-
  Raw metric length. A base primitive orbit with length L_p has length L_p/n
  in component n. The quantum spectral variable is the raw positive
  wavenumber K=sqrt(lambda), with no unfolding or nonlinear clock change.
normalization: >-
  Base lengths (1,sqrt(2),sqrt(3),sqrt(5)); exact 1/n component scaling;
  fixed L-outward magnetic line integrals (0,pi/3,2*pi/3,0); standard
  covariant Kirchhoff scattering; Dirichlet reflection -1 at D; no global
  scale, offset, anchoring, or fit.
determinant_convention: >-
  NOT_OPENED. In particular, neither the divergent ordinary orbit product,
  a componentwise bond-secular product, the heat/spectral zeta, nor a
  zeta-regularized characteristic determinant may be substituted for another.
  The standard finite component block B_n(s)=S*diag_b(exp(-s*ell_b/n+i*alpha_b))
  is named only to test trace-class eligibility of its direct sum; no global
  determinant is thereby opened.
cutoff:
  base_primitive_orbits: "complete directed-bond census through topological period 6"
  tower_components: "all n>=1 by exact scaling; displayed split checks use n<=16"
  determinant: "not opened"
  spectral_count: "all-order asymptotic theorem; no eigenvalue cutoff"
precision:
  exact: >-
    Fraction arithmetic for scattering and trace ledgers; integer squarefree
    length-count vectors; integer phase units modulo 6; symbolic scaling proofs
  floating: "Python binary64 only for displayed constants and asymptotic diagnostics"
allowed_data:
  - "the frozen graph and 1/n scaling rule above"
  - "exact finite graph scattering algebra and cyclic-word enumeration"
  - "standard compact metric-graph Weyl law and direct-sum operator theory"
  - "the Riemann-von Mangoldt asymptotic only as a structural target constraint"
forbidden_data:
  - "prime tables, primality predicates, or Riemann-zero tables"
  - "fitting the base lengths, tower scale, fluxes, clock, or spectral affine map"
  - "using validation or test zeros for any choice"
  - "calling zeros of the heat/spectral zeta operator eigenvalues"
  - "calling the spectral-zeta factor zeta(2z) a secular or completed-xi divisor"
  - "silently regularizing the infinite orbit or component determinant product"
  - "discarding orientation, signed scattering amplitudes, or magnetic phases"
  - "calling an abstract spectral-basis conjugation a local geometric time reversal"
  - "Route-B or Hilbert-Polya claims in this prefilter"
training_split: >-
  base topological periods 1-2 and tower labels 1-4; exact convention and
  identity checks only; no fitted parameters
validation_split: >-
  base topological periods 3-4 and tower labels 5-8 under the frozen rule
test_split: >-
  base topological periods 5-6, tower labels 9-16, the all-order T*log(T)
  wavenumber-count proof, and the ordinary-product divergence witness
stopping_conditions:
  - "NOT_TESTABLE if the graph, boundary conditions, component scaling, or clock changes"
  - "REJECTED if any target arithmetic table enters the definition"
  - "REVISE if the exact trace/repetition ledger fails through period 6"
  - "REVISE if the geometric antiunitary audit finds a length-preserving flux-reversing automorphism"
  - "STOP_SCOPED for the naive determinant if short-orbit accumulation prevents a standard Euler/Fredholm product"
  - "keep the unavoidable abstract spectral-basis conjugation separate from geometric or orbit-reversal symmetry"
  - "do not open Route B until one same-object determinant convention and trace ledger are frozen"
