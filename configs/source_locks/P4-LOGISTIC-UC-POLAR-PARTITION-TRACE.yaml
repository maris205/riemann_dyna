audit_id: P4-LOGISTIC-UC-POLAR-PARTITION-TRACE
parent_audit_id: P4-LOGISTIC-UC-POLAR-COMPLEX-BRANCH
lock_version: 1
formal_candidate: false
clue_id: CLUE-A1-004
title: Half-open partition coding and endpoint trace ledger for exact U_c

mathematical_object:
  inherited_map: >-
    Inherit exactly the corrected exact-U_c polar map
    G=q^(-1) o (-f^2) o q on I_L=[-pi/2,0] and I_R=[0,pi/2],
    with f(x)=1-U_c*x^2, rho=U_c-1, and U_c the unique real root of
    u^3-2*u^2+2*u-2=0. The rounded literal 1.543689 is forbidden.
  doubled_space: >-
    I_hat=I_L disjoint-union I_R keeps 0_L and 0_R distinct for branch
    coding. The geometric projection pi:I_hat->I identifies only
    pi(0_L)=pi(0_R)=0 and is one-to-one elsewhere.
  half_open_section: >-
    Freeze the geometric half-open partition
    I_L^ho=[-pi/2,0) and I_R^ho=[0,pi/2]. Thus the geometric partition point
    belongs to R. Every real orbit receives one forward half-open itinerary;
    changing endpoint ownership is a new lock.
  geometric_orbit_rule: >-
    A geometric periodic orbit is a cyclic orbit of G on I. Collapse cyclic
    rotations and count a partition-hit periodic orbit once, retaining its
    one-sided branch orientation and signed multiplier. Repetitions remain a
    separate r-fold operation and are never supplied by endpoint coding.
  doubled_lift_rule: >-
    A doubled-copy enumeration is auxiliary. Project each lifted word by pi,
    quotient the explicitly audited lift fibre of a geometric cyclic orbit,
    and compare with the unique half-open itinerary. Do not assume a universal
    2^h endpoint factor without a separate transition proof.
  endpoint_orbit_scope: >-
    Enumerate the exact boundary graph generated by 0, -pi/2, and pi/2.
    The audit must distinguish preperiodic endpoint hits from periodic ones;
    a preperiodic partition hit is not a periodic-trace contribution.
  matching_space_rule: >-
    For B_epsilon={(v_L,v_R): v_sigma holomorphic/continuous on U_sigma,
    v_L(0)=v_R(0)}, define delta(v)=v_L(0)-v_R(0). The frozen weighted
    composition formula has output F_s|_{U_L},F_s|_{U_R} for one common F_s,
    so L_s(B_epsilon) is contained in ker(delta). This proves common output
    matching, but not the local analytic trace multiplicity at a boundary. If
    a later nuclear extension to X=B_epsilon direct-sum C e is proved, the
    range inclusion gives a block form [[L_B,*],[0,0]] and hence
    Tr_X(L^n)=Tr_B(L_B^n) conditionally; it does not halve source-branch
    cyclic multiplicities.

data_type:
  primary: >-
    Exact half-open quotient coding, endpoint orbit graph, cyclic-word
    canonicalization, signed one-sided orientation ledger, and matching-range
    algebra.
  secondary: >-
    Deterministic 100-digit root-bracket and target-free symbolic/interval
    diagnostics inherited from the complex-branch lock.

clock:
  intrinsic_suspension_clock: >-
    tau=log|G'| with one full primitive roof sum per G period. Endpoint coding
    never rescales, offsets, or relabels tau.
  physical_clock: >-
    One G step remains two f iterates; this clock is reported separately and
    cannot enter the conditional determinant ledger.

normalization:
  coordinate: q(theta)=rho*sin(theta), unscaled
  branch_orientation: preserve phi_L'=+a and phi_R'=-a
  endpoint_ownership: I_L^ho=[-pi/2,0), I_R^ho=[0,pi/2]
  determinant_normalization: conditional parent notation only; no determinant opened

determinant_convention:
  future_intended_object: >-
    If later proved nuclear, use det_Fr(I-L_s) on the frozen matching space
    and the half-open quotient ledger. This checkpoint does not evaluate it.
  endpoint_trace_rule: >-
    The geometric multiplicity is the number of distinct half-open cyclic
    lifts, normally one. The raw doubled-copy count is not a trace certificate.
    A local matching-space calculation is still required before asserting that
    the analytic trace equals this quotient count.
  forbidden_mixing:
    - quotient-interval and doubled-copy traces without an explicit quotient map
    - physical return labels or Artin-Mazur tower zeta
    - absolute-value replacement of signed branch orientation
    - any prime, zero, xi, zeta, or fitted spectral factor

cutoff:
  endpoint_graph_cutoff: "exact finite boundary graph; no spectral cutoff"
  symbolic_word_cutoff: "N<=8 regression only; not a theorem about all periods"
  complex_radius: "1/1000 inherited, not changed"

precision:
  symbolic_definition: exact
  root_bracket_digits: 100
  environment: "python-flint 0.9.0 / FLINT 3.6.0 / SymPy 1.14.0 inherited"

allowed_data:
  - exact U_c polynomial and certified root bracket
  - inherited exact real and complex branch identities
  - elementary endpoint, quotient, cyclic-word, and matching-space algebra
  - target-free symbolic or outward-interval checks

forbidden_data:
  - prime or zero tables, xi/zeta evaluations, USTC data, or fitted parameters
  - changing U_c to the rounded legacy literal
  - changing epsilon, branch coding, endpoint ownership, roof, or normalization
  - claiming an analytic trace identity from matching at 0 alone
  - claiming nuclearity, a Fredholm determinant, Route B, Hilbert-Polya, or RH

training_split: empty; no fitting or target data
validation_split: >-
  Exact endpoint identities, half-open disjointness, projection/section maps,
  boundary orbit graph, cyclic-rotation canonicalization, and common-output
  matching lemma.
test_split: >-
  Sealed target-free checks through symbolic word length N<=8: endpoint orbit
  classification, half-open itinerary uniqueness, signed one-sided orientation,
  cyclic/repetition bookkeeping, and L/R endpoint-section swap invariance of
  the geometric quotient count.

stopping_conditions:
  - REVISE if the half-open partition is not disjoint and exhaustive
  - REVISE if the exact endpoint orbit graph is incomplete or ambiguous
  - REVISE if cyclic lift canonicalization is not unique at a boundary orbit
  - NOT_TESTABLE for the analytic trace multiplicity until a local matching-space calculation exists
  - REJECTED if arithmetic target data or a rounded U_c enters
  - STOP_SCOPED for nuclearity, determinant, zeros, quantization, Route B, or RH

success_conditions:
  - one exact half-open endpoint convention and projection map
  - one certified boundary orbit graph and preperiodic/periodic distinction
  - one finite symbolic canonicalization audit with signed orientation
  - one explicit statement of the remaining local trace identity obligation

route_status_at_lock:
  inherited_route_a_tuple: [A1_WEAK, A2_FAIL, A3_FAIL, A4_FAIL]
  route_a_evaluation_performed: false
  route_b_invocation_allowed: false
  checkpoint_status: DEFINED_NOT_EVALUATED
  recommended_verdict: REVISE

next_smallest_test: >-
  Run only the target-free endpoint/half-open itinerary certificate. If it
  passes, stop with the local matching-space trace identity still OPEN.
