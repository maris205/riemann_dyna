  LR, their periodic roof sums, and exact multiplier independence at the
  frozen precision. Failure to prove independence returns REVISE or
  NOT_TESTABLE; it does not prove the full roof lattice. No Fredholm or
  target-zero test is opened yet.

stopping_conditions:
  - NOT_TESTABLE if the doubled Markov endpoint convention or roof clock is ambiguous
  - REVISE if tau is not strictly positive on both closed branch copies
  - REVISE if the frozen complex branches or Log(a) are not single-valued on U_L and U_R
  - REVISE if the inverse branches do not map the frozen target closures compactly into the frozen source neighborhoods
  - REVISE if B_epsilon is not invariant under the stated weighted family
  - REVISE or NOT_TESTABLE if the sealed R/LR witnesses do not prove multiplicative independence
  - STOP_SCOPED for this roof only if a full periodic-sum or cohomological audit proves a lattice relation
  - REJECTED if arithmetic target data enters or any frozen convention is changed after validation begins
  - STOP_SCOPED for determinant, quantization, Route-B, Hilbert-Polya, or RH inference before the corresponding theorem exists

success_conditions:
  - one explicit map, doubled phase space, branch convention, and positive roof
  - one explicit separation of physical and suspension clocks
  - one explicit analytic Banach space and weighted transfer family
  - one sole conditional Fredholm determinant convention
  - frozen allowed/forbidden data, data split, precision, and stopping rules

