title: Exact-U_c polar Markov suspension with intrinsic log-Jacobian roof

mathematical_object:
  parent_map: >-
    f(x)=1-U_c*x^2 on J=[-(U_c-1),1], where U_c is the unique real root
    of u^3-2*u^2+2*u-2=0 and rho=U_c-1.
  parity_reduced_map: >-
    On A=[-rho,rho], T=f^2 and S=-T=rho-2*U_c^2*x^2+U_c^3*x^4.
  polar_coordinate: >-
    I=[-pi/2,pi/2], q(theta)=rho*sin(theta), and
    G=q^(-1) o S o q, branchwise on I_L=[-pi/2,0] and I_R=[0,pi/2].
    The left branch is increasing, the right branch is decreasing, and each
    closed branch maps onto all of I.
  markov_phase_space: >-
    Use the two-component Markov extension I_hat=I_L disjoint-union I_R.
    The two copies 0_L and 0_R remain distinct for branch coding, while the
    analytic function space below imposes matching values at the nonpolar
    partition point. Quotient-interval and doubled-Markov orbit ledgers may
    not be mixed.
  inverse_branches: >-
    For target eta set t(eta)=sqrt((1+rho*sin(eta))/U_c). The real inverse
    formulas on the interior are
    phi_L(eta)=-asin(sqrt((1-t(eta))/U_c)/rho) and
    phi_R(eta)=+asin(sqrt((1-t(eta))/U_c)/rho), with
    phi_L'=+a and phi_R'=-a, where
    a(eta)=(1/4)*sqrt((1+t(eta))*(rho+t(eta)))/t(eta). At the polar targets,
    phi_sigma means the unique composite analytic endpoint extension supplied
    by the exact endpoint factorization; no separate holomorphic asin branch
    through its scalar branch point is asserted.
  intrinsic_roof: >-
    The real roof is tau(theta)=log|G'(theta)| on branch interiors with its
    real-analytic endpoint extension. Equivalently,
    tau(phi_sigma(eta))=-log(a(eta)) on the real target interval. A future
    complex audit must use tau_L=Log(G'_L) and tau_R=Log(-G'_R), with branches
    normalized to their positive real values; log|G'| itself is not claimed
    to be holomorphic.
  roof_endpoint_values: >-
    inf tau=log(4/U_c^2)>0 at the polar outer endpoints, while the two
    nonpolar branch copies over theta=0 have tau=(1/2)*log(8/U_c).
  suspension_period: >-
    For a primitive Markov orbit gamma of G with base period n,
    T_gamma=sum_(k=0)^(n-1) tau(G^k theta)=log|(G^n)'(theta)|.
    Its r-th repetition has time r*T_gamma.
  periodic_word_convention: >-
    Letters record the forward branch occupied before each G iterate and are
    read in chronological order. R is the unique interior fixed point in
    (0,pi/2). LR is the unique interior primitive two-cycle with
    theta_L in (-pi/2,0), theta_R in (0,pi/2),
    G(theta_L)=theta_R, and G(theta_R)=theta_L; LR and RL are cyclic names for
    the same orbit. Freeze signed multipliers Lambda_R=G'(theta_R)<0 and
    Lambda_LR=G'(theta_L)*G'(theta_R)<0, and positive roof multipliers
    alpha=-Lambda_R and beta=-Lambda_LR.
  lattice_definition: >-
    The roof is lattice only if its periodic sums lie in one discrete subgroup
    h*Z (equivalently, under the applicable Livsic theorem, it is cohomologous
    to an h*Z-valued roof). An irrational ratio T_LR/T_R proves non-lattice.
    A rational relation for this sealed pair alone is inconclusive and cannot
    prove that the full roof is lattice.

data_type:
  primary: >-
    Exact real-analytic two-branch Markov map, its doubled branch coding,
    intrinsic positive roof, branch orientations, periodic multiplier sums,
    and one conditionally defined analytic weighted transfer family.
  complex_domain: >-
    Freeze epsilon=1/1000 and U_L={z in C: dist(z,I_L)<epsilon},
    U_R={z in C: dist(z,I_R)<epsilon}. The intended phi_L, phi_R are the
    composite holomorphic continuations of the real inverse branches, anchored
    by the exact endpoint factorizations. The intended a=phi_L'=-phi_R' and
    Log(a) use one common germ on U_L intersection U_R, normalized by a>0 on
    the real interval. Their existence and single-valuedness on the full
    frozen stadiums remain obligations, not claims. No later shrinking of
    epsilon is allowed in lock v2.
  analytic_function_space: >-
    B_epsilon={(v_L,v_R): v_sigma is continuous on closure(U_sigma),
    holomorphic on U_sigma, and v_L(0)=v_R(0)}, with the maximum sup norm.
  weighted_transfer_family: >-
    For j in {L,R} and z in U_j,
    (L_s v)_j(z)=exp(s*Log(a(z)))*
    [v_L(phi_L(z))+v_R(phi_R(z))]. This is the potential -s*tau.
    The common-germ convention is required for the two output components to
    match at z=0. Its well-definedness, boundedness, compact branch inclusion,
    nuclearity, and determinant existence are not asserted by this checkpoint.
  excluded: >-
    Physical first-return masses, the unit return-label clock, empirical
    matrices, Ulam truncations, prime/zero tables, and any separately glued
    zeta, reciprocal, logarithmic derivative, or scattering ledger.

clock:
  physical_discrete_clock: >-
    Let H=-q. Then H o G=f^2 o H on I, so one G step represents exactly two
    iterates of f; q alone conjugates G to the reflected map S=-f^2. Physical
    return labels remain measured in f iterates and are not determinant
    periods for this object. Since H' vanishes at the polar endpoints, the
    intrinsic roof there is not the physical log-Jacobian of f^2.
  intrinsic_suspension_clock: >-
    The determinant clock is the roof time tau=log|G'|. No multiplicative
    scale, additive offset, affine spectral map, or unfolding is permitted.
  separation_rule: >-
    The two-f-iterate base clock and the positive roof clock must be reported
    separately. Neither may be substituted for the other in an orbit or
    determinant claim.

normalization:
  coordinate: "q(theta)=rho*sin(theta) with no further rescaling"
  roof: "tau=log|G'| exactly, with the real natural logarithm"
  branch_orientation: >-
    Preserve phi_L'=+a and phi_R'=-a. The roof uses the positive magnitude a,
    but orientation remains a separate orbit datum and may not be discarded.
  spectral_parameter: "s multiplies tau directly in exp(-s*tau)=a^s"

determinant_convention:
  sole_intended_object: >-
    D_pol(s)=det_Fr(I-L_s) on B_epsilon, only if a later audit proves that the
    frozen L_s is nuclear on the frozen space. Until then D_pol is a
    conditional notation, not an established Fredholm determinant.
  forbidden_ledgers:
    - Artin-Mazur zeta of the earlier recurrent tower
    - reciprocal zeta, logarithmic derivative, or unweighted orbit product
    - Perron-Frobenius density operator on a different function space
    - any modular scattering, Selberg, prime, or zero-derived factor
  endpoint_multiplicity: >-
    The determinant ledger uses the doubled two-component Markov extension
    and the matching subspace B_epsilon. Any quotient-interval determinant is
    a different object and requires a new source lock.
  endpoint_trace_rule: >-
    Not defined in lock v2. The sealed R and LR witnesses are interior and do
    not hit the partition point. No determinant trace, endpoint orbit count,
    or Fredholm audit is permitted until a later source lock fixes the target
    copy and multiplicity for every partition-hit orbit.

